<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidal Clip Prototype</title>
  <style>
    :root {
      --bg: #0d1016;
      --bg-alt: #121722;
      --panel: #131926;
      --panel-strong: #0f141e;
      --ink: #edf2ff;
      --muted: #93a0ba;
      --accent: #7ae582;
      --accent-soft: rgba(122, 229, 130, 0.12);
      --border: #232b3c;
      --radius: 14px;
      --drawer-width: 80ch;
      --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--ink);
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(54, 73, 115, 0.18), transparent 180px),
        linear-gradient(180deg, var(--bg) 0%, #0a0d13 100%);
    }

    .shell {
      width: 100%;
      height: 100vh;
      display: grid;
      gap: 12px;
    }

    .hero,
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0;
      overflow: hidden;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 52px;
      padding: 10px 18px;
      border-left: 0;
      border-right: 0;
      border-top: 0;
      background: #101521;
    }

    .hero-copy {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      line-height: 1;
      letter-spacing: 0.02em;
      font-weight: 700;
    }

    .hero-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .workspace {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
      align-items: start;
      padding: 0 12px 12px;
      min-height: 0;
    }

    .arrangement-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
      height: calc(100vh - 90px);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-alt);
    }

    .panel-title {
      margin: 0;
      font-size: 0.92rem;
      letter-spacing: -0.02em;
    }

    .panel-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .roll-wrap {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-height: 0;
      padding: 12px;
    }

    .roll-frame {
      background: var(--panel-strong);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      min-height: 0;
      height: 100%;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 0 0;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #0f141e;
      border: 1px solid var(--border);
      color: var(--ink);
      font-size: 0.8rem;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      flex: 0 0 auto;
    }

    .editor {
      padding: 12px 14px 14px;
      height: 100%;
      overflow: auto;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 10px;
      flex-wrap: wrap;
    }

    .kbd {
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 5px 8px;
      border-radius: 8px;
      background: #0f141e;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .field {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.82rem;
      font-family: var(--mono);
    }

    .field select,
    .field input {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0f141e;
      color: var(--ink);
      padding: 9px 10px;
      font: inherit;
      min-height: 38px;
    }

    .field input {
      width: 88px;
    }

    .field select {
      min-width: 220px;
    }

    .button-row {
      display: inline-flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 1px solid #2b7a4b;
      border-radius: 10px;
      background: #163324;
      color: #d9ffe0;
      padding: 10px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease;
    }

    button:hover,
    button:focus-visible {
      background: #1d412e;
      border-color: #3f9a63;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid var(--border);
      background: #0f141e;
      color: var(--ink);
      font: 0.96rem/1.55 var(--mono);
      outline: none;
    }

    textarea:focus {
      border-color: #355a88;
      box-shadow: 0 0 0 1px #355a88;
    }

    .status {
      min-height: 48px;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: #101724;
      color: #b9c6df;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .editor-drawer > .status {
      margin-top: 0;
      border-radius: 0;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
      background: var(--bg-alt);
    }

    .guide {
      display: grid;
      gap: 10px;
      padding: 0 14px 14px;
    }

    .guide code {
      font-family: var(--mono);
      background: #0f141e;
      padding: 0.12rem 0.28rem;
      border-radius: 5px;
    }

    .guide p {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .editor-drawer {
      position: fixed;
      top: 64px;
      right: 0;
      bottom: 12px;
      width: min(var(--drawer-width), calc(100vw - 24px));
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-right: 0;
      border-radius: 14px 0 0 14px;
      transform: translateX(100%);
      transition: transform 180ms ease;
      z-index: 30;
      overflow: visible;
    }

    body.drawer-open .editor-drawer {
      transform: translateX(0);
    }

    .drawer-handle {
      position: absolute;
      top: 50%;
      left: -34px;
      transform: translateY(-50%);
      width: 34px;
      height: 152px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #43506a;
      border-right: 0;
      border-radius: 16px 0 0 16px;
      background:
        linear-gradient(180deg, #1c2740 0%, #141c2c 100%);
      color: #dbe7ff;
      cursor: pointer;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font: 0.74rem var(--mono);
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
      transition: background 140ms ease, color 140ms ease, left 140ms ease, width 140ms ease;
    }

    .drawer-handle:hover,
    .drawer-handle:focus-visible {
      left: -38px;
      width: 38px;
      color: #ffffff;
      background:
        linear-gradient(180deg, #2a3b62 0%, #1b2842 100%);
    }

    .drawer-body {
      min-height: 0;
      overflow: auto;
      padding: 0;
    }

    .drawer-body .editor {
      height: 100%;
      display: flex;
      padding: 0;
    }

    .drawer-body textarea {
      height: 100%;
      min-height: 100%;
      border: 0;
      border-radius: 0;
    }

    @media (max-width: 980px) {
      .hero {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero-controls {
        justify-content: flex-start;
      }

      .editor-drawer {
        top: 116px;
        bottom: 12px;
        width: min(var(--drawer-width), calc(100vw - 12px));
      }

      .arrangement-panel {
        height: calc(100vh - 142px);
      }

      .roll-frame,
      textarea {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-copy">
        <h1>Tidal Pattern Arranger</h1>
      </div>
      <div class="hero-controls">
        <div class="kbd">Ctrl/Cmd + Enter</div>
        <label class="field">
          <span>MIDI Out</span>
          <select id="midi-output">
            <option value="">No MIDI output</option>
          </select>
        </label>
        <label class="field">
          <span>BPM</span>
          <input id="bpm-input" type="number" min="30" max="240" step="1" value="120">
        </label>
        <div class="button-row">
          <button id="run-button" type="button">Execute Pattern</button>
          <button id="midi-refresh-button" type="button">Refresh MIDI</button>
          <button id="play-button" type="button">Play</button>
          <button id="stop-button" type="button">Stop</button>
        </div>
      </div>
    </section>

    <section class="workspace">
      <section class="panel arrangement-panel">
        <header class="panel-header">
          <div>
            <h2 class="panel-title">Arrangement View</h2>
          </div>
          <p class="panel-note">16-step guide grid</p>
        </header>
        <div class="roll-wrap">
          <div class="roll-frame">
            <svg id="piano-roll" viewBox="0 0 980 520" role="img" aria-label="Piano roll arrangement preview"></svg>
          </div>
          <div id="legend" class="legend" aria-label="Instrument legend"></div>
        </div>
      </section>
    </section>

    <aside id="editor-drawer" class="editor-drawer panel" aria-label="Pattern editor drawer">
      <button id="drawer-handle" class="drawer-handle" type="button" aria-expanded="false" aria-controls="pattern-input">Pattern</button>
      <header class="panel-header">
        <div>
          <h2 class="panel-title">Pattern Input</h2>
        </div>
        <p class="panel-note">Arrangement source</p>
      </header>
      <div class="drawer-body">
        <div class="editor">
          <textarea id="pattern-input" spellcheck="false">track drums {
  seqP [
    stack [
      s "bd*4 [cp hh cp] bd"
    ],
    stack [
      s "[bd hh] cp hh bd*2"
    ]
  ]
}

track synth {
  seqP [
    stack [
      n "c4 [e4 g4] a4*2 ~" # s "superpiano",
      n "[60 62] ~ [67 69]*2 72" # s "lead"
    ],
    stack [
      n "a3 [c4 e4] g4*2 ~" # s "superpiano"
    ]
  ]
}

-- CC automation: filter cutoff LFO then stepped pattern
track cutoff {
  seqP [
    ccn 74 # ccv (sine 16 10 110),
    ccn 74 # ccv "110 90 70 50 30 10 30 60"
  ]
}

-- CC automation: resonance sweep
track resonance {
  seqP [
    ccn 71 # ccv (saw 8 0 100)
  ]
}</textarea>
        </div>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </aside>
  </main>

  <script>
    const svg = document.getElementById("piano-roll");
    const legend = document.getElementById("legend");
    const input = document.getElementById("pattern-input");
    const status = document.getElementById("status");
    const runButton = document.getElementById("run-button");
    const playButton = document.getElementById("play-button");
    const stopButton = document.getElementById("stop-button");
    const midiRefreshButton = document.getElementById("midi-refresh-button");
    const midiOutputSelect = document.getElementById("midi-output");
    const bpmInput = document.getElementById("bpm-input");
    const editorDrawer = document.getElementById("editor-drawer");
    const drawerHandle = document.getElementById("drawer-handle");

    let midiAccess = null;
    let currentArrangement = null;
    let currentEvents = [];
    let activeEventIds = new Set();
    let playbackTimer = null;
    let playbackStopTimer = null;
    let playbackStartedAt = 0;
    let playbackLoopDurationMs = 0;
    let playbackToken = 0;

    const palette = [
      "#d85f45",
      "#2d6a4f",
      "#7c5cff",
      "#ca6702",
      "#0f4c5c",
      "#b23a48",
      "#227c9d",
      "#5f0f40",
      "#6b8f71",
      "#8a5a44"
    ];

    const drumNotes = {
      bd: 36,
      kick: 36,
      sd: 38,
      sn: 38,
      cp: 39,
      rim: 37,
      hh: 42,
      ch: 42,
      oh: 46,
      hc: 42,
      ho: 46,
      lt: 45,
      mt: 47,
      ht: 50,
      rs: 37,
      cb: 56,
      cym: 49
    };

    function splitTopLevel(source, separator) {
      const parts = [];
      let depth = 0;
      let quote = "";
      let current = "";

      for (let i = 0; i < source.length; i += 1) {
        const char = source[i];
        const prev = source[i - 1];

        if (quote) {
          current += char;
          if (char === quote && prev !== "\\") {
            quote = "";
          }
          continue;
        }

        if (char === "\"" || char === "'") {
          quote = char;
          current += char;
          continue;
        }

        if (char === "[" || char === "<" || char === "(") {
          depth += 1;
          current += char;
          continue;
        }

        if (char === "]" || char === ">" || char === ")") {
          depth = Math.max(0, depth - 1);
          current += char;
          continue;
        }

        if (depth === 0) {
          if (separator === "space" && /\s/.test(char)) {
            if (current.trim()) {
              parts.push(current.trim());
              current = "";
            }
            continue;
          }

          if (separator === "comma" && char === ",") {
            if (current.trim()) {
              parts.push(current.trim());
              current = "";
            }
            continue;
          }
        }

        current += char;
      }

      if (current.trim()) {
        parts.push(current.trim());
      }

      return parts;
    }

    function unwrapOuterBrackets(value) {
      const trimmed = value.trim();
      if (!trimmed.startsWith("[") || !trimmed.endsWith("]")) {
        return null;
      }

      let depth = 0;
      let quote = "";
      for (let i = 0; i < trimmed.length; i += 1) {
        const char = trimmed[i];
        const prev = trimmed[i - 1];

        if (quote) {
          if (char === quote && prev !== "\\") {
            quote = "";
          }
          continue;
        }

        if (char === "\"" || char === "'") {
          quote = char;
          continue;
        }

        if (char === "[") {
          depth += 1;
        } else if (char === "]") {
          depth -= 1;
          if (depth === 0 && i !== trimmed.length - 1) {
            return null;
          }
        }
      }

      return trimmed.slice(1, -1);
    }

    function splitRepeat(item) {
      let depth = 0;
      let quote = "";

      for (let i = item.length - 1; i >= 0; i -= 1) {
        const char = item[i];
        const prev = item[i - 1];

        if (quote) {
          if (char === quote && prev !== "\\") {
            quote = "";
          }
          continue;
        }

        if (char === "\"" || char === "'") {
          quote = char;
          continue;
        }

        if (char === "]" || char === ">" || char === ")") {
          depth += 1;
          continue;
        }

        if (char === "[" || char === "<" || char === "(") {
          depth -= 1;
          continue;
        }

        if (char === "*" && depth === 0) {
          const countText = item.slice(i + 1).trim();
          if (/^\d+$/.test(countText)) {
            return {
              base: item.slice(0, i).trim(),
              count: Number.parseInt(countText, 10)
            };
          }
        }
      }

      return null;
    }

    function parseNoteValue(token) {
      const trimmed = token.trim();
      if (!trimmed || trimmed === "~") {
        return null;
      }

      const drum = drumNotes[trimmed.toLowerCase()];
      if (typeof drum === "number") {
        return drum;
      }

      if (/^-?\d+$/.test(trimmed)) {
        return Number.parseInt(trimmed, 10);
      }

      const match = trimmed.match(/^([a-gA-G])([#b]?)(-?\d+)$/);
      if (!match) {
        return null;
      }

      const [, noteName, accidental, octaveText] = match;
      const base = {
        c: 0,
        d: 2,
        e: 4,
        f: 5,
        g: 7,
        a: 9,
        b: 11
      }[noteName.toLowerCase()];
      const accidentalOffset = accidental === "#" ? 1 : accidental === "b" ? -1 : 0;
      const octave = Number.parseInt(octaveText, 10);

      return (octave + 1) * 12 + base + accidentalOffset;
    }

    function extractQuotedArgument(source, keyword) {
      const pattern = new RegExp(`\\b${keyword}\\b\\s*(?:\\$\\s*)?([\"'])(.*?)\\1`, "i");
      const match = source.match(pattern);
      return match ? match[2] : null;
    }

    function extractCcvLfo(source) {
      const match = source.match(/\bccv\b\s*\(([^)]*)\)/i);
      return match ? match[1].trim() : null;
    }

    function expandLfo(lfoExpr) {
      const match = lfoExpr.match(/^(sine|saw|tri|square)\s+(\d+)\s+(\d+)\s+(\d+)$/i);
      if (!match) {
        return null;
      }
      const [, shape, stepsStr, loStr, hiStr] = match;
      const n = parseInt(stepsStr, 10);
      const lo = parseInt(loStr, 10);
      const hi = parseInt(hiStr, 10);
      const values = [];
      for (let i = 0; i < n; i += 1) {
        const t = i / n;
        let norm;
        switch (shape.toLowerCase()) {
          case "sine": norm = (Math.sin(t * 2 * Math.PI - Math.PI / 2) + 1) / 2; break;
          case "saw": norm = t; break;
          case "tri": norm = t < 0.5 ? t * 2 : (1 - t) * 2; break;
          case "square": norm = t < 0.5 ? 1 : 0; break;
          default: norm = 0.5;
        }
        values.push(Math.round(lo + norm * (hi - lo)));
      }
      return values.join(" ");
    }

    function stripLineComments(source) {
      let result = "";
      let quote = "";

      for (let i = 0; i < source.length; i += 1) {
        const char = source[i];
        const next = source[i + 1];
        const prev = source[i - 1];

        if (quote) {
          result += char;
          if (char === quote && prev !== "\\") {
            quote = "";
          }
          continue;
        }

        if (char === "\"" || char === "'") {
          quote = char;
          result += char;
          continue;
        }

        if (char === "-" && next === "-") {
          while (i < source.length && source[i] !== "\n") {
            i += 1;
          }
          if (i < source.length) {
            result += "\n";
          }
          continue;
        }

        result += char;
      }

      return result;
    }

    function extractStackVoices(source) {
      const stackIndex = source.search(/\bstack\b/i);
      if (stackIndex === -1) {
        return null;
      }

      const openIndex = source.indexOf("[", stackIndex);
      if (openIndex === -1) {
        return null;
      }

      let depth = 0;
      let quote = "";
      for (let i = openIndex; i < source.length; i += 1) {
        const char = source[i];
        const prev = source[i - 1];

        if (quote) {
          if (char === quote && prev !== "\\") {
            quote = "";
          }
          continue;
        }

        if (char === "\"" || char === "'") {
          quote = char;
          continue;
        }

        if (char === "[") {
          depth += 1;
        } else if (char === "]") {
          depth -= 1;
          if (depth === 0) {
            const inner = source.slice(openIndex + 1, i);
            return splitTopLevel(inner, "comma");
          }
        }
      }

      return null;
    }

    function normalizeVoiceList(source) {
      const stackVoices = extractStackVoices(source);
      if (stackVoices !== null) {
        return stackVoices;
      }

      return source
        .split(/\n+/)
        .map((line) => line.trim())
        .map((line) => line.replace(/^,+/, "").trim())
        .filter(Boolean)
        .filter((line) => line !== "[" && line !== "]");
    }

    function voiceFromExpression(expression, index) {
      const ccnNumMatch = expression.match(/\bccn\b\s+(\d+)/i);
      if (ccnNumMatch) {
        const ccn = parseInt(ccnNumMatch[1], 10);
        const ccvQuoted = extractQuotedArgument(expression, "ccv");
        const ccvLfoSrc = extractCcvLfo(expression);
        let ccvPattern = "64";
        if (ccvQuoted !== null) {
          ccvPattern = ccvQuoted;
        } else if (ccvLfoSrc !== null) {
          ccvPattern = expandLfo(ccvLfoSrc) || "64";
        } else {
          const plainMatch = expression.match(/\bccv\b\s+(\d+)/i);
          if (plainMatch) {
            ccvPattern = plainMatch[1];
          }
        }
        return { type: "cc", ccn, instrument: `cc${ccn}`, pattern: ccvPattern, mode: "cc", source: expression };
      }

      const customVoiceMatch = expression.match(/^([a-zA-Z0-9_-]+)\s*:\s*(.+)$/);
      if (customVoiceMatch) {
        const instrument = customVoiceMatch[1];
        const pattern = customVoiceMatch[2];
        return {
          instrument,
          pattern,
          mode: "auto",
          source: expression
        };
      }

      const notePattern = extractQuotedArgument(expression, "n") || extractQuotedArgument(expression, "note");
      const soundPattern = extractQuotedArgument(expression, "s") || extractQuotedArgument(expression, "sound");

      if (notePattern) {
        const instrument = soundPattern
          ? splitTopLevel(soundPattern, "space").find((token) => token !== "~") || `voice-${index + 1}`
          : `voice-${index + 1}`;
        return {
          instrument,
          pattern: notePattern,
          mode: "pitched",
          source: expression
        };
      }

      if (soundPattern) {
        const tokens = splitTopLevel(soundPattern, "space");
        const instrument = tokens.find((token) => token !== "~") || `drums-${index + 1}`;
        return {
          instrument,
          pattern: soundPattern,
          mode: "drums",
          source: expression
        };
      }

      return {
        instrument: `voice-${index + 1}`,
        pattern: expression,
        mode: "auto",
        source: expression
      };
    }

    function expandPattern(pattern, start, duration, events, voice) {
      const trimmed = pattern.trim();
      if (!trimmed) {
        return;
      }

      const repeat = splitRepeat(trimmed);
      if (repeat && repeat.base) {
        const step = duration / repeat.count;
        for (let i = 0; i < repeat.count; i += 1) {
          expandPattern(repeat.base, start + (step * i), step, events, voice);
        }
        return;
      }

      const bracketBody = unwrapOuterBrackets(trimmed);
      if (bracketBody !== null) {
        const items = splitTopLevel(bracketBody, "space");
        if (!items.length) {
          return;
        }
        const step = duration / items.length;
        items.forEach((item, index) => {
          expandPattern(item, start + (step * index), step, events, voice);
        });
        return;
      }

      const items = splitTopLevel(trimmed, "space");
      if (items.length > 1) {
        const step = duration / items.length;
        items.forEach((item, index) => {
          expandPattern(item, start + (step * index), step, events, voice);
        });
        return;
      }

      const token = items[0];
      if (!token || token === "~") {
        return;
      }

      const pitch = resolvePitch(token, voice);
      events.push({
        instrument: resolveInstrument(token, voice),
        label: token,
        pitch,
        ccn: voice.mode === "cc" ? voice.ccn : undefined,
        type: voice.mode === "cc" ? "cc" : "note",
        isDrum: voice.mode === "cc" ? false : (voice.mode !== "pitched" && typeof drumNotes[token.toLowerCase()] === "number"),
        start,
        duration
      });
    }

    function resolveInstrument(token, voice) {
      if (voice.mode === "drums") {
        return token.toLowerCase();
      }
      return voice.instrument;
    }

    function resolvePitch(token, voice) {
      if (voice.mode === "cc") {
        const val = parseInt(token, 10);
        return isNaN(val) ? 64 : Math.max(0, Math.min(127, val));
      }

      if (voice.mode === "pitched") {
        const midi = parseNoteValue(token);
        return midi === null ? 60 : midi;
      }

      const drumPitch = drumNotes[token.toLowerCase()];
      if (typeof drumPitch === "number") {
        return drumPitch;
      }

      const midi = parseNoteValue(token);
      if (midi !== null) {
        return midi;
      }

      const fallbackBase = 48 + (voice.instrument.length % 12);
      return fallbackBase;
    }

    function scaleEventsIntoWindow(events, startOffset, durationScale) {
      return events.map((event) => ({
        ...event,
        start: startOffset + (event.start * durationScale),
        duration: event.duration * durationScale
      }));
    }

    function parseSource(source, options = {}) {
      const { allowEmpty = false } = options;
      const sanitized = stripLineComments(source);
      const repeated = splitRepeat(sanitized.trim());

      if (repeated && repeated.base) {
        const repeatedEvents = [];
        const sliceDuration = 1 / repeated.count;

        for (let i = 0; i < repeated.count; i += 1) {
          const baseEvents = parseSource(repeated.base, { allowEmpty: true });
          repeatedEvents.push(...scaleEventsIntoWindow(baseEvents, i * sliceDuration, sliceDuration));
        }

        if (!repeatedEvents.length && !allowEmpty) {
          throw new Error("No playable events were parsed. The pattern is empty or fully commented out.");
        }

        return repeatedEvents.sort((a, b) => a.start - b.start || b.pitch - a.pitch);
      }

      const voices = normalizeVoiceList(sanitized).map(voiceFromExpression);
      const events = [];

      voices.forEach((voice) => {
        expandPattern(voice.pattern, 0, 1, events, voice);
      });

      if (!events.length && !allowEmpty) {
        throw new Error("No playable events were parsed. The pattern is empty or fully commented out.");
      }

      return events.sort((a, b) => a.start - b.start || b.pitch - a.pitch);
    }

    function findMatchingDelimiter(source, openIndex, openChar, closeChar) {
      let depth = 0;
      let quote = "";

      for (let i = openIndex; i < source.length; i += 1) {
        const char = source[i];
        const prev = source[i - 1];

        if (quote) {
          if (char === quote && prev !== "\\") {
            quote = "";
          }
          continue;
        }

        if (char === "\"" || char === "'") {
          quote = char;
          continue;
        }

        if (char === openChar) {
          depth += 1;
        } else if (char === closeChar) {
          depth -= 1;
          if (depth === 0) {
            return i;
          }
        }
      }

      return -1;
    }

    function unwrapOuterParens(value) {
      const trimmed = value.trim();
      if (!trimmed.startsWith("(") || !trimmed.endsWith(")")) {
        return null;
      }

      const closeIndex = findMatchingDelimiter(trimmed, 0, "(", ")");
      if (closeIndex !== trimmed.length - 1) {
        return null;
      }

      return trimmed.slice(1, -1).trim();
    }

    function splitTopLevelStatements(source) {
      const statements = [];
      let depth = 0;
      let quote = "";
      let current = "";

      for (let i = 0; i < source.length; i += 1) {
        const char = source[i];
        const prev = source[i - 1];

        if (quote) {
          current += char;
          if (char === quote && prev !== "\\") {
            quote = "";
          }
          continue;
        }

        if (char === "\"" || char === "'") {
          quote = char;
          current += char;
          continue;
        }

        if (char === "[" || char === "{" || char === "(") {
          depth += 1;
          current += char;
          continue;
        }

        if (char === "]" || char === "}" || char === ")") {
          depth = Math.max(0, depth - 1);
          current += char;
          continue;
        }

        if (char === "\n" && depth === 0) {
          if (current.trim()) {
            statements.push(current.trim());
          }
          current = "";
          continue;
        }

        current += char;
      }

      if (current.trim()) {
        statements.push(current.trim());
      }

      return statements;
    }

    function expandSequenceExpression(expression, env = {}) {
      const trimmed = expression.trim();
      if (!trimmed) {
        return [];
      }

      if (env[trimmed]) {
        return env[trimmed];
      }

      const parenBody = unwrapOuterParens(trimmed);
      if (parenBody !== null) {
        return expandSequenceExpression(parenBody, env);
      }

      const replicateMatch = trimmed.match(/^replicate\s+(\d+)\s+([\s\S]+)$/);
      if (replicateMatch) {
        const count = Number.parseInt(replicateMatch[1], 10);
        const source = replicateMatch[2].trim();
        const expanded = expandSequenceExpression(source, env);
        const repeated = [];
        for (let i = 0; i < count; i += 1) {
          repeated.push(...expanded);
        }
        return repeated;
      }

      const catListMatch = trimmed.match(/^cat\s*\[(.*)\]$/s);
      if (catListMatch) {
        return splitTopLevel(catListMatch[1], "comma").flatMap((item) => expandSequenceExpression(item, env));
      }

      const catParenMatch = trimmed.match(/^cat\s*\(([\s\S]+)\)$/);
      if (catParenMatch) {
        return expandSequenceExpression(catParenMatch[1], env);
      }

      return [trimmed];
    }

    function extractLetBindings(source, inheritedEnv = {}) {
      const env = { ...inheritedEnv };
      const remaining = [];

      splitTopLevelStatements(source).forEach((statement) => {
        const match = statement.match(/^let\s+([a-zA-Z][a-zA-Z0-9_-]*)\s*=\s*([\s\S]+)$/);
        if (!match) {
          remaining.push(statement);
          return;
        }

        env[match[1]] = expandSequenceExpression(match[2], env);
      });

      return {
        env,
        source: remaining.join("\n")
      };
    }

    function normalizeBlockName(rawName, fallback) {
      const trimmed = rawName.trim();
      if (!trimmed) {
        return fallback;
      }

      if ((trimmed.startsWith("\"") && trimmed.endsWith("\"")) || (trimmed.startsWith("'") && trimmed.endsWith("'"))) {
        return trimmed.slice(1, -1);
      }

      return trimmed;
    }

    function extractTrackBlocks(source) {
      const blocks = [];
      const regex = /\btrack\b\s+("[^"]+"|'[^']+'|[a-zA-Z0-9_-]+)\s*\{/g;
      let match;

      while ((match = regex.exec(source))) {
        const openIndex = source.indexOf("{", match.index);
        const closeIndex = findMatchingDelimiter(source, openIndex, "{", "}");
        if (closeIndex === -1) {
          throw new Error(`Unclosed track block for ${normalizeBlockName(match[1], "track")}.`);
        }

        blocks.push({
          name: normalizeBlockName(match[1], `track-${blocks.length + 1}`),
          body: source.slice(openIndex + 1, closeIndex)
        });

        regex.lastIndex = closeIndex + 1;
      }

      return blocks;
    }

    function extractSeqBlocks(source) {
      const sequences = [];
      const regex = /\bseqP\b\s*\[/g;
      let match;

      while ((match = regex.exec(source))) {
        const openIndex = source.indexOf("[", match.index);
        const closeIndex = findMatchingDelimiter(source, openIndex, "[", "]");
        if (closeIndex === -1) {
          throw new Error("Unclosed seqP block.");
        }

        const inner = source.slice(openIndex + 1, closeIndex);
        sequences.push(splitTopLevel(inner, "comma").filter(Boolean));
        regex.lastIndex = closeIndex + 1;
      }

      return sequences;
    }

    function scaleSequenceEvents(events, segment, trackName) {
      return events.map((event) => ({
        ...event,
        track: trackName,
        segmentStart: segment.start,
        segmentDuration: segment.duration,
        start: segment.start + (event.start * segment.duration),
        duration: event.duration * segment.duration
      }));
    }

    function sequenceStepsFromSource(source, env = {}) {
      const sequences = extractSeqBlocks(source);
      if (sequences.length) {
        return sequences.flatMap((sequence) => sequence.flatMap((item) => expandSequenceExpression(item, env)));
      }

      const trimmed = source.trim();
      return trimmed ? expandSequenceExpression(trimmed, env) : [];
    }

    function parseArrangement(source) {
      const sanitized = stripLineComments(source);
      const topLevel = extractLetBindings(sanitized);
      const trackBlocks = extractTrackBlocks(topLevel.source);

      if (!trackBlocks.length) {
        const steps = sequenceStepsFromSource(topLevel.source, topLevel.env);
        const segments = steps.map((step, index) => ({
          start: index,
          duration: 1,
          source: step,
          name: `seq-${index + 1}`,
          events: scaleSequenceEvents(parseSource(step, { allowEmpty: true }), { start: index, duration: 1 }, "track-1")
        }));
        return {
          totalLength: Math.max(1, segments.length),
          tracks: [
            {
              name: "track-1",
              segments,
              events: segments.flatMap((segment) => segment.events)
            }
          ]
        };
      }

      const tracks = trackBlocks.map((trackBlock, trackIndex) => {
        const trackScope = extractLetBindings(trackBlock.body, topLevel.env);
        const segments = sequenceStepsFromSource(trackScope.source, trackScope.env).map((step, stepIndex) => {
          const stepDef = {
            start: stepIndex,
            duration: 1
          };
          return {
            ...stepDef,
            source: step,
            name: `seq-${stepIndex + 1}`,
            events: step ? scaleSequenceEvents(parseSource(step, { allowEmpty: true }), stepDef, trackBlock.name) : []
          };
        });

        return {
          name: trackBlock.name || `track-${trackIndex + 1}`,
          segments,
          events: segments.flatMap((segment) => segment.events)
        };
      });

      return {
        totalLength: Math.max(1, ...tracks.flatMap((track) => track.segments.map((segment) => segment.start + segment.duration))),
        tracks
      };
    }

    function instrumentColorMap(events) {
      const instruments = [...new Set(events.map((event) => event.instrument))];
      return new Map(instruments.map((name, index) => [name, palette[index % palette.length]]));
    }

    function pitchRange(events) {
      const pitches = events.map((event) => event.pitch);
      const min = Math.min(...pitches);
      const max = Math.max(...pitches);
      const span = Math.max(8, max - min + 1);

      return {
        min: Math.max(0, min - 1),
        max: Math.min(127, min + span)
      };
    }

    function noteName(midi) {
      const names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
      const octave = Math.floor(midi / 12) - 1;
      return `${names[midi % 12]}${octave}`;
    }

    function setDrawerOpen(isOpen) {
      document.body.classList.toggle("drawer-open", isOpen);
      drawerHandle.setAttribute("aria-expanded", isOpen ? "true" : "false");
      drawerHandle.textContent = isOpen ? "Hide Pattern" : "Pattern";
    }

    function toggleDrawer() {
      setDrawerOpen(!document.body.classList.contains("drawer-open"));
    }

    function assignEventIds(arrangement) {
      let nextId = 1;
      arrangement.tracks.forEach((track, trackIndex) => {
        track.segments.forEach((segment, segmentIndex) => {
          segment.events.forEach((event) => {
            event.id = `t${trackIndex + 1}-s${segmentIndex + 1}-e${nextId}`;
            event.channel = event.isDrum ? 9 : trackIndex % 9;
            event.velocity = event.isDrum ? 108 : 92;
            nextId += 1;
          });
        });
        track.events = track.segments.flatMap((segment) => segment.events);
      });

      return arrangement;
    }

    function getSelectedBpm() {
      const parsed = Number.parseFloat(bpmInput.value);
      if (!Number.isFinite(parsed)) {
        return 120;
      }
      return Math.max(30, Math.min(240, parsed));
    }

    function getStepDurationMs() {
      return (60000 / getSelectedBpm()) * 4;
    }

    function getSelectedMidiOutput() {
      if (!midiAccess) {
        return null;
      }
      return midiAccess.outputs.get(midiOutputSelect.value) || null;
    }

    function clearActiveHighlights() {
      activeEventIds.forEach((eventId) => setEventHighlight(eventId, false));
      activeEventIds.clear();
    }

    function setEventHighlight(eventId, isActive) {
      const group = svg.querySelector(`[data-event-id="${eventId}"]`);
      if (!group) {
        return;
      }

      const body = group.querySelector(".note-body");
      const outline = group.querySelector(".note-outline");
      const label = group.querySelector(".note-label");

      if (body) {
        const restOpacity = body.getAttribute("data-rest-opacity") || "0.9";
        body.setAttribute("opacity", isActive ? "1" : restOpacity);
        body.setAttribute("filter", isActive ? "url(#note-glow)" : "");
      }

      if (outline) {
        outline.setAttribute("stroke", isActive ? "rgba(255,255,255,0.95)" : "rgba(0,0,0,0.14)");
        outline.setAttribute("stroke-width", isActive ? "1.8" : "1");
      }

      if (label) {
        label.setAttribute("fill", isActive ? "rgba(255,255,255,1)" : "rgba(255,255,255,0.9)");
      }
    }

    function sendAllNotesOff() {
      const output = getSelectedMidiOutput();
      if (!output) {
        return;
      }

      for (let channel = 0; channel < 16; channel += 1) {
        output.send([0xB0 + channel, 123, 0]);
      }
    }

    function clearPlaybackTimers() {
      if (playbackTimer !== null) {
        clearInterval(playbackTimer);
        playbackTimer = null;
      }

      if (playbackStopTimer !== null) {
        clearTimeout(playbackStopTimer);
        playbackStopTimer = null;
      }
    }

    function stopPlayback(options = {}) {
      const { preserveStatus = false } = options;
      playbackToken += 1;
      clearPlaybackTimers();
      sendAllNotesOff();
      clearActiveHighlights();
      playButton.textContent = "Play";
      if (!preserveStatus && status.textContent.startsWith("Playing")) {
        status.textContent = "Playback stopped.";
      }
    }

    function triggerEvent(event, output, token) {
      activeEventIds.add(event.id);
      setEventHighlight(event.id, true);

      if (event.type === "cc") {
        if (output) {
          output.send([0xB0 + event.channel, event.ccn, event.pitch]);
        }
        window.setTimeout(() => {
          if (playbackToken !== token) {
            return;
          }
          activeEventIds.delete(event.id);
          setEventHighlight(event.id, false);
        }, Math.max(40, event.duration * getStepDurationMs() - 8));
        return;
      }

      if (output) {
        output.send([0x90 + event.channel, event.pitch, event.velocity]);
      }

      window.setTimeout(() => {
        if (playbackToken !== token) {
          return;
        }
        activeEventIds.delete(event.id);
        setEventHighlight(event.id, false);
        if (output) {
          output.send([0x80 + event.channel, event.pitch, 0]);
        }
      }, Math.max(40, event.duration * getStepDurationMs() - 8));
    }

    function schedulePlaybackPass(startedAt) {
      const output = getSelectedMidiOutput();
      const token = playbackToken;
      const stepDurationMs = getStepDurationMs();
      currentEvents.forEach((event) => {
        const eventDelay = Math.max(0, event.start * stepDurationMs);
        window.setTimeout(() => {
          if (playbackStartedAt !== startedAt || playbackToken !== token) {
            return;
          }
          triggerEvent(event, output, token);
        }, eventDelay);
      });
    }

    async function refreshMidiOutputs() {
      if (!navigator.requestMIDIAccess) {
        midiOutputSelect.innerHTML = `<option value="">Web MIDI unavailable</option>`;
        return null;
      }

      try {
        midiAccess = await navigator.requestMIDIAccess();
        const outputs = [...midiAccess.outputs.values()];
        const previousValue = midiOutputSelect.value;
        midiOutputSelect.innerHTML = `<option value="">No MIDI output</option>`;
        outputs.forEach((output) => {
          const option = document.createElement("option");
          option.value = output.id;
          option.textContent = output.name || output.manufacturer || output.id;
          midiOutputSelect.appendChild(option);
        });
        if (outputs.some((output) => output.id === previousValue)) {
          midiOutputSelect.value = previousValue;
        }
        return midiAccess;
      } catch (error) {
        midiOutputSelect.innerHTML = `<option value="">MIDI access denied</option>`;
        throw error;
      }
    }

    function startPlayback() {
      if (!currentEvents.length) {
        status.textContent = "Nothing to play. Execute a pattern first.";
        return;
      }

      stopPlayback({ preserveStatus: true });
      playbackStartedAt = performance.now();
      playbackToken += 1;
      playbackLoopDurationMs = currentArrangement.totalLength * getStepDurationMs();
      schedulePlaybackPass(playbackStartedAt);
      playbackTimer = window.setInterval(() => {
        schedulePlaybackPass(playbackStartedAt);
      }, playbackLoopDurationMs);
      playButton.textContent = "Playing";
      status.textContent = `Playing ${currentEvents.length} notes at ${getSelectedBpm()} BPM${getSelectedMidiOutput() ? " via MIDI output" : " with visual highlighting only"}.`;
    }

    function renderArrangement(arrangement) {
      const allEvents = arrangement.tracks.flatMap((track) => track.events);
      const rollFrame = svg.parentElement;
      const width = Math.max(200, rollFrame.clientWidth);
      const height = Math.max(200, rollFrame.clientHeight);
      const margin = { top: 26, right: 18, bottom: 28, left: 96 };
      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;
      const totalLength = Math.max(1, arrangement.totalLength);
      const trackCount = Math.max(1, arrangement.tracks.length);
      const trackHeight = innerHeight / trackCount;
      const colorMap = instrumentColorMap(allEvents);
      const parts = [];

      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      parts.push(`<rect width="${width}" height="${height}" fill="#fffaf0"></rect>`);
      parts.push(`<defs><filter id="note-glow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffffff" flood-opacity="0.45"></feDropShadow></filter></defs>`);

      for (let tick = 0; tick <= totalLength * 4; tick += 1) {
        const x = margin.left + (innerWidth * tick) / (totalLength * 4);
        const isCycle = tick % 4 === 0;
        parts.push(`<line x1="${x}" y1="${margin.top}" x2="${x}" y2="${height - margin.bottom}" stroke="${isCycle ? "rgba(53,46,31,0.22)" : "rgba(53,46,31,0.08)"}" stroke-width="${isCycle ? 1.2 : 1}"></line>`);
        if (tick < totalLength * 4 && isCycle) {
          parts.push(`<text x="${x + 4}" y="16" fill="#6d665a" font-family="IBM Plex Mono, monospace" font-size="11">${tick / 4}</text>`);
        }
      }

      arrangement.tracks.forEach((track, trackIndex) => {
        const top = margin.top + trackIndex * trackHeight;
        const laneY = top + 8;
        const laneHeight = Math.max(28, trackHeight - 14);
        const titleFontSize = trackHeight > 90 ? 18 : trackHeight > 64 ? 15 : 12;
        const metaFontSize = trackHeight > 64 ? 11 : 9;
        const showMeta = trackHeight > 48;
        const cornerRadius = Math.max(8, Math.min(18, trackHeight * 0.16));
        const isCcTrack = track.events.length > 0 && track.events.every((e) => e.type === "cc");

        // Split note tracks into piano-roll zone + velocity/automation zone
        const autoRatio = 0.28;
        const noteZoneH = isCcTrack ? 0 : Math.floor(laneHeight * (1 - autoRatio));
        const autoZoneH = laneHeight - noteZoneH;
        const autoZoneY = laneY + noteZoneH;

        const bgFill = isCcTrack ? "rgba(235,240,255,0.55)" : "rgba(255,255,255,0.5)";
        parts.push(`<rect x="10" y="${top}" width="${width - 20}" height="${Math.max(24, trackHeight - 2)}" rx="${cornerRadius}" fill="${bgFill}" stroke="rgba(31,31,27,0.08)"></rect>`);
        parts.push(`<text x="26" y="${top + Math.min(28, trackHeight * 0.45)}" fill="#1f1f1b" font-family="Space Grotesk, sans-serif" font-size="${titleFontSize}" font-weight="700">${track.name}</text>`);
        if (showMeta) {
          const metaLabel = isCcTrack
            ? `CC automation · ${track.segments.length} step${track.segments.length === 1 ? "" : "s"}`
            : `${track.segments.length} seq step${track.segments.length === 1 ? "" : "s"}`;
          parts.push(`<text x="26" y="${top + Math.min(48, trackHeight * 0.72)}" fill="#6d665a" font-family="IBM Plex Mono, monospace" font-size="${metaFontSize}">${metaLabel}</text>`);
        }

        if (!isCcTrack) {
          // ── Piano Roll Zone ───────────────────────────────────────────
          const noteEvents = track.events.filter((e) => e.type !== "cc");
          const trackRange = noteEvents.length ? pitchRange(noteEvents) : { min: 60, max: 68 };
          const pitchCount = trackRange.max - trackRange.min + 1;
          const rowHeight = noteZoneH / pitchCount;

          for (let pitch = trackRange.min; pitch <= trackRange.max; pitch += 1) {
            const row = trackRange.max - pitch;
            const y = laneY + row * rowHeight;
            const isBlack = [1, 3, 6, 8, 10].includes(pitch % 12);
            parts.push(`<rect x="${margin.left}" y="${y}" width="${innerWidth}" height="${rowHeight}" fill="${isBlack ? "rgba(17,17,17,0.035)" : "rgba(255,255,255,0.09)"}"></rect>`);
            parts.push(`<line x1="${margin.left}" y1="${y}" x2="${width - margin.right}" y2="${y}" stroke="rgba(53,46,31,0.06)" stroke-width="1"></line>`);
          }

          if (noteZoneH > 54) {
            parts.push(`<text x="${margin.left - 10}" y="${laneY + 12}" text-anchor="end" fill="#6d665a" font-family="IBM Plex Mono, monospace" font-size="${metaFontSize}">${noteName(trackRange.max)}</text>`);
            parts.push(`<text x="${margin.left - 10}" y="${laneY + noteZoneH - 4}" text-anchor="end" fill="#6d665a" font-family="IBM Plex Mono, monospace" font-size="${metaFontSize}">${noteName(trackRange.min)}</text>`);
          }

          track.segments.forEach((segment, segmentIndex) => {
            const segmentX = margin.left + (segment.start / totalLength) * innerWidth;
            const segmentWidth = Math.max(10, (segment.duration / totalLength) * innerWidth);
            parts.push(`<rect x="${segmentX}" y="${laneY}" width="${segmentWidth}" height="${laneHeight}" rx="${Math.max(6, Math.min(14, laneHeight * 0.14))}" fill="rgba(22,66,60,0.04)" stroke="rgba(22,66,60,0.2)" stroke-dasharray="5 5"></rect>`);
            if (trackHeight > 50) {
              parts.push(`<text x="${segmentX + 8}" y="${laneY + 16}" fill="#16423c" font-family="IBM Plex Mono, monospace" font-size="${metaFontSize}">seq ${segmentIndex + 1}</text>`);
            }
          });

          // Note rectangles
          noteEvents.forEach((event) => {
            const x = margin.left + (event.start / totalLength) * innerWidth;
            const w = Math.max(6, (event.duration / totalLength) * innerWidth - 2);
            const y = laneY + (trackRange.max - event.pitch) * rowHeight + 2;
            const h = Math.max(8, rowHeight - 4);
            const fill = colorMap.get(event.instrument);
            const label = `${event.instrument}: ${event.label}`;
            const isActive = activeEventIds.has(event.id);
            parts.push(`<g data-event-id="${event.id}">`);
            parts.push(`<rect class="note-body" x="${x + 1}" y="${y}" width="${w}" height="${h}" rx="7" fill="${fill}" opacity="${isActive ? "1" : "0.9"}" ${isActive ? `filter="url(#note-glow)"` : ""}></rect>`);
            parts.push(`<rect class="note-outline" x="${x + 1}" y="${y}" width="${w}" height="${h}" rx="7" fill="none" stroke="${isActive ? "rgba(255,255,255,0.95)" : "rgba(0,0,0,0.14)"}" stroke-width="${isActive ? "1.8" : "1"}"></rect>`);
            if (w > 44 && h > 13) {
              parts.push(`<text class="note-label" x="${x + 7}" y="${y + h * 0.62}" fill="rgba(255,255,255,0.9)" font-family="IBM Plex Mono, monospace" font-size="10">${label}</text>`);
            }
            parts.push(`</g>`);
          });

          // ── Velocity Lane ─────────────────────────────────────────────
          if (autoZoneH > 6) {
            parts.push(`<line x1="${margin.left}" y1="${autoZoneY}" x2="${width - margin.right}" y2="${autoZoneY}" stroke="rgba(53,46,31,0.14)" stroke-width="1"></line>`);
            if (autoZoneH > 14) {
              parts.push(`<text x="${margin.left - 6}" y="${autoZoneY + autoZoneH * 0.6}" text-anchor="end" fill="#9b9287" font-family="IBM Plex Mono, monospace" font-size="${metaFontSize}">vel</text>`);
            }
            noteEvents.forEach((event) => {
              const x = margin.left + (event.start / totalLength) * innerWidth;
              const velNorm = (event.velocity || 100) / 127;
              const barH = Math.max(1, velNorm * autoZoneH);
              const y = autoZoneY + autoZoneH - barH;
              const fill = colorMap.get(event.instrument);
              parts.push(`<rect x="${x}" y="${y}" width="2" height="${barH}" fill="${fill}" opacity="0.75"></rect>`);
            });
          }
        } else {
          // ── CC Automation Lane (step-function line graph) ─────────────
          // Grid lines at 0, 32, 64, 96, 127
          for (const pct of [0, 0.25, 0.5, 0.75, 1.0]) {
            const y = autoZoneY + autoZoneH * (1 - pct);
            parts.push(`<line x1="${margin.left}" y1="${y}" x2="${width - margin.right}" y2="${y}" stroke="rgba(53,46,31,0.1)" stroke-width="1" stroke-dasharray="3 4"></line>`);
            if (trackHeight > 44) {
              parts.push(`<text x="${margin.left - 6}" y="${y + 4}" text-anchor="end" fill="#6d665a" font-family="IBM Plex Mono, monospace" font-size="${metaFontSize}">${Math.round(pct * 127)}</text>`);
            }
          }

          track.segments.forEach((segment, segmentIndex) => {
            const segmentX = margin.left + (segment.start / totalLength) * innerWidth;
            const segmentWidth = Math.max(10, (segment.duration / totalLength) * innerWidth);
            parts.push(`<rect x="${segmentX}" y="${autoZoneY}" width="${segmentWidth}" height="${autoZoneH}" rx="${Math.max(6, Math.min(14, autoZoneH * 0.14))}" fill="rgba(30,50,120,0.04)" stroke="rgba(30,50,120,0.18)" stroke-dasharray="5 5"></rect>`);
            if (trackHeight > 50) {
              parts.push(`<text x="${segmentX + 8}" y="${autoZoneY + 16}" fill="#223080" font-family="IBM Plex Mono, monospace" font-size="${metaFontSize}">seq ${segmentIndex + 1}</text>`);
            }
          });

          // Group events by ccn, draw one filled step-function area per controller
          const ccGroups = new Map();
          track.events.forEach((event) => {
            if (!ccGroups.has(event.ccn)) {
              ccGroups.set(event.ccn, []);
            }
            ccGroups.get(event.ccn).push(event);
          });

          ccGroups.forEach((events, ccn) => {
            const sorted = [...events].sort((a, b) => a.start - b.start);
            const fill = colorMap.get(`cc${ccn}`) || "#7c5cff";
            const baseY = autoZoneY + autoZoneH;
            let pathD = "";
            sorted.forEach((event, i) => {
              const x1 = margin.left + (event.start / totalLength) * innerWidth;
              const x2 = margin.left + ((event.start + event.duration) / totalLength) * innerWidth;
              const y = autoZoneY + autoZoneH * (1 - event.pitch / 127);
              if (i === 0) {
                pathD += `M ${x1} ${baseY} L ${x1} ${y}`;
              } else {
                pathD += ` L ${x1} ${y}`;
              }
              pathD += ` L ${x2} ${y}`;
              if (i === sorted.length - 1) {
                pathD += ` L ${x2} ${baseY} Z`;
              }
            });
            if (pathD) {
              parts.push(`<path d="${pathD}" fill="${fill}" fill-opacity="0.18" stroke="${fill}" stroke-width="2" stroke-linejoin="round"></path>`);
            }
          });

          // Invisible hit targets per event for playback highlight
          track.events.forEach((event) => {
            const x = margin.left + (event.start / totalLength) * innerWidth;
            const w = Math.max(2, (event.duration / totalLength) * innerWidth - 1);
            const y = autoZoneY + autoZoneH * (1 - event.pitch / 127);
            const h = Math.max(4, autoZoneY + autoZoneH - y);
            const fill = colorMap.get(event.instrument) || "#7c5cff";
            const isActive = activeEventIds.has(event.id);
            parts.push(`<g data-event-id="${event.id}">`);
            parts.push(`<rect class="note-body" x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" opacity="${isActive ? "0.35" : "0"}" data-rest-opacity="0" ${isActive ? `filter="url(#note-glow)"` : ""}></rect>`);
            parts.push(`</g>`);
          });
        }
      });

      svg.innerHTML = parts.join("");
      legend.innerHTML = "";
      [...colorMap.entries()].forEach(([instrument, color]) => {
        const item = document.createElement("div");
        item.className = "legend-item";
        item.innerHTML = `<span class="legend-swatch" style="background:${color}"></span><span>${instrument}</span>`;
        legend.appendChild(item);
      });
    }

    function renderEmptyState(message) {
      clearActiveHighlights();
      const rollFrame = svg.parentElement;
      const w = Math.max(200, rollFrame.clientWidth);
      const h = Math.max(200, rollFrame.clientHeight);
      svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
      svg.innerHTML = [
        `<rect width="${w}" height="${h}" fill="#fffaf0"></rect>`,
        `<text x="${w / 2}" y="${h / 2 - 16}" text-anchor="middle" fill="#6d665a" font-family="IBM Plex Mono, monospace" font-size="18">No notes to display</text>`,
        `<text x="${w / 2}" y="${h / 2 + 14}" text-anchor="middle" fill="#8b8477" font-family="IBM Plex Mono, monospace" font-size="12">${message}</text>`
      ].join("");
      legend.innerHTML = "";
    }

    function executePattern() {
      try {
        stopPlayback({ preserveStatus: true });
        const arrangement = assignEventIds(parseArrangement(input.value));
        const events = arrangement.tracks.flatMap((track) => track.events);
        if (!events.length) {
          throw new Error("No playable events were parsed. The pattern is empty or fully commented out.");
        }
        currentArrangement = arrangement;
        currentEvents = events;
        renderArrangement(arrangement);
        const instruments = [...new Set(events.map((event) => event.instrument))];
        const stepCount = arrangement.tracks.reduce((sum, track) => sum + track.segments.length, 0);
        status.textContent = `Rendered ${events.length} events across ${arrangement.tracks.length} track${arrangement.tracks.length === 1 ? "" : "s"}, ${stepCount} seq step${stepCount === 1 ? "" : "s"}, and ${instruments.length} instrument${instruments.length === 1 ? "" : "s"}.`;
      } catch (error) {
        currentArrangement = null;
        currentEvents = [];
        renderEmptyState("Pattern empty after parsing");
        status.textContent = error.message;
      }
    }

    runButton.addEventListener("click", executePattern);
    playButton.addEventListener("click", startPlayback);
    stopButton.addEventListener("click", () => stopPlayback());
    drawerHandle.addEventListener("click", toggleDrawer);
    midiRefreshButton.addEventListener("click", async () => {
      try {
        await refreshMidiOutputs();
        status.textContent = `MIDI outputs refreshed.${getSelectedMidiOutput() ? ` Selected: ${getSelectedMidiOutput().name || getSelectedMidiOutput().id}.` : ""}`;
      } catch (error) {
        status.textContent = `Unable to access Web MIDI: ${error.message}`;
      }
    });
    input.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        executePattern();
      }
    });
    document.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "b") {
        event.preventDefault();
        toggleDrawer();
      }
    });

    setDrawerOpen(true);
    refreshMidiOutputs().catch(() => {});
    executePattern();
  </script>
</body>
</html>
