<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidal Clip Prototype</title>
  <style>
    :root {
      --bg: #0d1016;
      --panel: #131926;
      --panel-strong: #0f141e;
      --ink: #edf2ff;
      --muted: #93a0ba;
      --accent: #7ae582;
      --border: #232b3c;
      --radius: 14px;
      --drawer-width: 80ch;
      --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--ink);
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(54, 73, 115, 0.18), transparent 180px),
        linear-gradient(180deg, var(--bg) 0%, #0a0d13 100%);
    }

    .shell {
      width: 100%;
      height: 100vh;
      display: grid;
      gap: 12px;
    }

    .hero,
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0;
      overflow: hidden;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 52px;
      padding: 10px 18px;
      border-left: 0;
      border-right: 0;
      border-top: 0;
      background: #101521;
    }

    .hero-copy {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      line-height: 1;
      letter-spacing: 0.02em;
      font-weight: 700;
    }

    .hero-controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .workspace {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
      align-items: start;
      padding: 0 12px 12px;
      min-height: 0;
    }

    .arrangement-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
      height: calc(100vh - 90px);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
      background: #101521;
    }

    .panel-title {
      margin: 0;
      font-size: 0.92rem;
      letter-spacing: -0.02em;
    }

    .panel-note {
      margin: 0;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .roll-wrap {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-height: 0;
      padding: 12px;
    }

    .roll-frame {
      background: var(--panel-strong);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      overflow-y: hidden;
      min-height: 0;
      height: 100%;
    }

    .canvas-stack {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .canvas-stack canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    #roll-highlight {
      pointer-events: none;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 0 0;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #0f141e;
      border: 1px solid var(--border);
      color: var(--ink);
      font-size: 0.8rem;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      flex: 0 0 auto;
    }

    .editor {
      padding: 12px 14px 14px;
      height: 100%;
      overflow: auto;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 10px;
      flex-wrap: wrap;
    }

    .kbd {
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 5px 8px;
      border-radius: 8px;
      background: #0f141e;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .field {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.82rem;
      font-family: var(--mono);
    }

    .field select,
    .field input {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0f141e;
      color: var(--ink);
      padding: 9px 10px;
      font: inherit;
      min-height: 38px;
    }

    .field input {
      width: 88px;
    }

    .field select {
      min-width: 220px;
    }

    .button-row {
      display: inline-flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #1a2035;
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.78rem;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease;
    }

    button:hover,
    button:focus-visible {
      background: #222c45;
    }

    button#run-button {
      background: rgba(122, 229, 130, 0.12);
      border-color: rgba(122, 229, 130, 0.35);
      color: var(--accent);
    }

    button#run-button:hover,
    button#run-button:focus-visible {
      background: rgba(122, 229, 130, 0.2);
    }

    textarea {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid var(--border);
      background: #0f141e;
      color: var(--ink);
      font: 0.96rem/1.55 var(--mono);
      outline: none;
    }

    textarea:focus {
      border-color: #355a88;
      box-shadow: 0 0 0 1px #355a88;
    }

    .status {
      min-height: 48px;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: #101724;
      color: #b9c6df;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .editor-drawer > .status {
      margin-top: 0;
      border-radius: 0;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
      background: #101521;
    }

    .guide {
      display: grid;
      gap: 10px;
      padding: 0 14px 14px;
    }

    .guide code {
      font-family: var(--mono);
      background: #0f141e;
      padding: 0.12rem 0.28rem;
      border-radius: 5px;
    }

    .guide p {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .editor-drawer {
      position: fixed;
      top: 64px;
      right: 0;
      bottom: 12px;
      width: min(var(--drawer-width), calc(100vw - 24px));
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-right: 0;
      border-radius: 14px 0 0 14px;
      transform: translateX(100%);
      transition: transform 180ms ease;
      z-index: 30;
      overflow: visible;
    }

    body.drawer-open .editor-drawer {
      transform: translateX(0);
    }

    .drawer-handle {
      position: absolute;
      top: 50%;
      left: -34px;
      transform: translateY(-50%);
      width: 34px;
      height: 152px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #43506a;
      border-right: 0;
      border-radius: 16px 0 0 16px;
      background:
        linear-gradient(180deg, #1c2740 0%, #141c2c 100%);
      color: #dbe7ff;
      cursor: pointer;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font: 0.74rem var(--mono);
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
      transition: background 140ms ease, color 140ms ease, left 140ms ease, width 140ms ease;
    }

    .drawer-handle:hover,
    .drawer-handle:focus-visible {
      left: -38px;
      width: 38px;
      color: #ffffff;
      background:
        linear-gradient(180deg, #2a3b62 0%, #1b2842 100%);
    }

    .drawer-body {
      min-height: 0;
      overflow: auto;
      padding: 0;
    }

    .drawer-body .editor {
      height: 100%;
      display: flex;
      padding: 0;
    }

    .drawer-body textarea {
      height: 100%;
      min-height: 100%;
      border: 0;
      border-radius: 0;
    }

    @media (max-width: 980px) {
      .hero {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero-controls {
        justify-content: flex-start;
      }

      .editor-drawer {
        top: 116px;
        bottom: 12px;
        width: min(var(--drawer-width), calc(100vw - 12px));
      }

      .arrangement-panel {
        height: calc(100vh - 142px);
      }

      .roll-frame,
      textarea {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-copy">
        <h1>Tidal Pattern Arranger</h1>
      </div>
      <div class="hero-controls">
        <div class="kbd">Ctrl/Cmd + Enter</div>
        <label class="field">
          <span>MIDI Out</span>
          <select id="midi-output">
            <option value="">No MIDI output</option>
          </select>
        </label>
        <label class="field">
          <span>BPM</span>
          <input id="bpm-input" type="number" min="30" max="240" step="1" value="120">
        </label>
        <div class="button-row">
          <button id="run-button" type="button">Execute Pattern</button>
          <button id="midi-refresh-button" type="button">Refresh MIDI</button>
          <button id="play-button" type="button">Play</button>
          <button id="stop-button" type="button">Stop</button>
          <button id="export-midi-button" type="button">Export MIDI</button>
        </div>
      </div>
    </section>

    <section class="workspace">
      <section class="panel arrangement-panel">
        <header class="panel-header">
          <div>
            <h2 class="panel-title">Arrangement View</h2>
          </div>
          <p class="panel-note">16-step guide grid</p>
        </header>
        <div class="roll-wrap">
          <div class="roll-frame">
            <div class="canvas-stack">
              <canvas id="roll-base"></canvas>
              <canvas id="roll-highlight"></canvas>
            </div>
          </div>
          <div id="legend" class="legend" aria-label="Instrument legend"></div>
        </div>
      </section>
    </section>

    <aside id="editor-drawer" class="editor-drawer panel" aria-label="Pattern editor drawer">
      <button id="drawer-handle" class="drawer-handle" type="button" aria-expanded="false" aria-controls="pattern-input">Pattern</button>
      <header class="panel-header">
        <div>
          <h2 class="panel-title">Pattern Input</h2>
        </div>
        <p class="panel-note">Arrangement source</p>
      </header>
      <div class="drawer-body">
        <div class="editor">
          <textarea id="pattern-input" spellcheck="false">track drums {
  seqP [
    stack [
      s "bd*4 [cp hh cp] bd"
    ],
    stack [
      s "[bd hh] cp hh bd*2"
    ]
  ]
}

track synth {
  seqP [
    stack [
      n "c4 [e4 g4] a4*2 ~" # s "superpiano",
      n "[60 62] ~ [67 69]*2 72" # s "lead"
    ],
    stack [
      n "a3 [c4 e4] g4*2 ~" # s "superpiano"
    ]
  ]
}

-- CC automation: filter cutoff LFO then stepped pattern
track cutoff {
  seqP [
    ccn 74 # ccv (sine 16 10 110),
    ccn 74 # ccv "110 90 70 50 30 10 30 60"
  ]
}

-- CC automation: resonance sweep
track resonance {
  seqP [
    ccn 71 # ccv (saw 8 0 100)
  ]
}</textarea>
        </div>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </aside>
  </main>

  <script type="module">
    import {
      parseArrangement, parseSource, assignEventIds,
      instrumentColorMap, pitchRange, noteName
    } from "./parser.js";

    const rollFrame = document.querySelector(".roll-frame");
    const baseCanvas = document.getElementById("roll-base");
    const hlCanvas = document.getElementById("roll-highlight");
    const baseCtx = baseCanvas.getContext("2d");
    const hlCtx = hlCanvas.getContext("2d");
    const eventRects = new Map(); // event.id → {x, y, w, h, fill}

    const legend = document.getElementById("legend");
    const input = document.getElementById("pattern-input");
    const status = document.getElementById("status");
    const runButton = document.getElementById("run-button");
    const playButton = document.getElementById("play-button");
    const stopButton = document.getElementById("stop-button");
    const midiRefreshButton = document.getElementById("midi-refresh-button");
    const exportMidiButton = document.getElementById("export-midi-button");
    const midiOutputSelect = document.getElementById("midi-output");
    const bpmInput = document.getElementById("bpm-input");
    const editorDrawer = document.getElementById("editor-drawer");
    const drawerHandle = document.getElementById("drawer-handle");

    let midiAccess = null;
    let currentArrangement = null;
    let zoomX = 1.0;
    let currentEvents = [];
    let activeEventIds = new Set();
    let playbackTimer = null;
    let playbackStopTimer = null;
    let playbackStartedAt = 0;
    let playbackLoopDurationMs = 0;
    let playbackToken = 0;

    function setDrawerOpen(isOpen) {
      document.body.classList.toggle("drawer-open", isOpen);
      drawerHandle.setAttribute("aria-expanded", isOpen ? "true" : "false");
      drawerHandle.textContent = isOpen ? "Hide Pattern" : "Pattern";
    }

    function toggleDrawer() {
      setDrawerOpen(!document.body.classList.contains("drawer-open"));
    }

    function getSelectedBpm() {
      const parsed = Number.parseFloat(bpmInput.value);
      if (!Number.isFinite(parsed)) {
        return 120;
      }
      return Math.max(30, Math.min(240, parsed));
    }

    function getStepDurationMs() {
      return (60000 / getSelectedBpm()) * 4;
    }

    function getSelectedMidiOutput() {
      if (!midiAccess) {
        return null;
      }
      return midiAccess.outputs.get(midiOutputSelect.value) || null;
    }

    function clearActiveHighlights() {
      activeEventIds.clear();
      hlCtx.clearRect(0, 0, hlCanvas.width, hlCanvas.height);
    }

    function redrawHighlights() {
      hlCtx.clearRect(0, 0, hlCanvas.width, hlCanvas.height);
      activeEventIds.forEach((id) => {
        const r = eventRects.get(id);
        if (!r) return;
        hlCtx.save();
        hlCtx.shadowBlur = 14;
        hlCtx.shadowColor = "rgba(255,255,255,0.55)";
        hlCtx.fillStyle = r.fill;
        hlCtx.globalAlpha = 1.0;
        hlCtx.beginPath();
        hlCtx.roundRect(r.x, r.y, r.w, r.h, 3);
        hlCtx.fill();
        hlCtx.restore();
      });
    }

    function setEventHighlight(eventId, isActive) {
      if (isActive) activeEventIds.add(eventId);
      else activeEventIds.delete(eventId);
      redrawHighlights();
    }

    function sendAllNotesOff() {
      const output = getSelectedMidiOutput();
      if (!output) {
        return;
      }

      for (let channel = 0; channel < 16; channel += 1) {
        output.send([0xB0 + channel, 123, 0]);
      }
    }

    function clearPlaybackTimers() {
      if (playbackTimer !== null) {
        clearInterval(playbackTimer);
        playbackTimer = null;
      }

      if (playbackStopTimer !== null) {
        clearTimeout(playbackStopTimer);
        playbackStopTimer = null;
      }
    }

    function stopPlayback(options = {}) {
      const { preserveStatus = false } = options;
      playbackToken += 1;
      clearPlaybackTimers();
      sendAllNotesOff();
      clearActiveHighlights();
      playButton.textContent = "Play";
      if (!preserveStatus && status.textContent.startsWith("Playing")) {
        status.textContent = "Playback stopped.";
      }
    }

    function triggerEvent(event, output, token) {
      activeEventIds.add(event.id);
      setEventHighlight(event.id, true);

      if (event.type === "cc") {
        if (output) {
          output.send([0xB0 + event.channel, event.ccn, event.pitch]);
        }
        window.setTimeout(() => {
          if (playbackToken !== token) {
            return;
          }
          activeEventIds.delete(event.id);
          setEventHighlight(event.id, false);
        }, Math.max(40, event.duration * getStepDurationMs() - 8));
        return;
      }

      if (output) {
        output.send([0x90 + event.channel, event.pitch, event.velocity]);
      }

      window.setTimeout(() => {
        if (playbackToken !== token) {
          return;
        }
        activeEventIds.delete(event.id);
        setEventHighlight(event.id, false);
        if (output) {
          output.send([0x80 + event.channel, event.pitch, 0]);
        }
      }, Math.max(40, event.duration * getStepDurationMs() - 8));
    }

    function schedulePlaybackPass(startedAt) {
      const output = getSelectedMidiOutput();
      const token = playbackToken;
      const stepDurationMs = getStepDurationMs();
      currentEvents.forEach((event) => {
        const eventDelay = Math.max(0, event.start * stepDurationMs);
        window.setTimeout(() => {
          if (playbackStartedAt !== startedAt || playbackToken !== token) {
            return;
          }
          triggerEvent(event, output, token);
        }, eventDelay);
      });
    }

    async function refreshMidiOutputs() {
      if (!navigator.requestMIDIAccess) {
        midiOutputSelect.innerHTML = `<option value="">Web MIDI unavailable</option>`;
        return null;
      }

      try {
        midiAccess = await navigator.requestMIDIAccess();
        const outputs = [...midiAccess.outputs.values()];
        const previousValue = midiOutputSelect.value;
        midiOutputSelect.innerHTML = `<option value="">No MIDI output</option>`;
        outputs.forEach((output) => {
          const option = document.createElement("option");
          option.value = output.id;
          option.textContent = output.name || output.manufacturer || output.id;
          midiOutputSelect.appendChild(option);
        });
        if (outputs.some((output) => output.id === previousValue)) {
          midiOutputSelect.value = previousValue;
        }
        return midiAccess;
      } catch (error) {
        midiOutputSelect.innerHTML = `<option value="">MIDI access denied</option>`;
        throw error;
      }
    }

    function startPlayback() {
      if (!currentEvents.length) {
        status.textContent = "Nothing to play. Execute a pattern first.";
        return;
      }

      stopPlayback({ preserveStatus: true });
      playbackStartedAt = performance.now();
      playbackToken += 1;
      playbackLoopDurationMs = currentArrangement.totalLength * getStepDurationMs();
      schedulePlaybackPass(playbackStartedAt);
      playbackTimer = window.setInterval(() => {
        schedulePlaybackPass(playbackStartedAt);
      }, playbackLoopDurationMs);
      playButton.textContent = "Playing";
      status.textContent = `Playing ${currentEvents.length} notes at ${getSelectedBpm()} BPM${getSelectedMidiOutput() ? " via MIDI output" : " with visual highlighting only"}.`;
    }

    function renderArrangement(arrangement) {
      const W = Math.max(200, rollFrame.clientWidth * zoomX);
      const H = Math.max(200, rollFrame.clientHeight);
      baseCanvas.width = hlCanvas.width = W;
      baseCanvas.height = hlCanvas.height = H;
      baseCanvas.style.width = hlCanvas.style.width = W + "px";
      baseCanvas.style.height = hlCanvas.style.height = H + "px";

      const left = 88, right = 16, top = 28, bottom = 8;
      const IW = W - left - right;
      const IH = H - top - bottom;
      const totalLength = Math.max(1, arrangement.totalLength);
      const trackCount = Math.max(1, arrangement.tracks.length);
      const trackH = IH / trackCount;
      const allEvents = arrangement.tracks.flatMap((t) => t.events);
      const colorMap = instrumentColorMap(allEvents);

      eventRects.clear();

      // Background
      baseCtx.fillStyle = "#0b0e15";
      baseCtx.fillRect(0, 0, W, H);

      // Step/bar grid lines
      for (let tick = 0; tick <= totalLength * 4; tick++) {
        const x = left + IW * tick / (totalLength * 4);
        const isBar = tick % 4 === 0;
        baseCtx.strokeStyle = isBar ? "rgba(255,255,255,0.1)" : "rgba(255,255,255,0.035)";
        baseCtx.lineWidth = isBar ? 1.2 : 0.7;
        baseCtx.setLineDash([]);
        baseCtx.beginPath();
        baseCtx.moveTo(x, top);
        baseCtx.lineTo(x, H - bottom);
        baseCtx.stroke();
        if (isBar && tick < totalLength * 4) {
          baseCtx.font = '10px "IBM Plex Mono", monospace';
          baseCtx.fillStyle = "#3a4a6a";
          baseCtx.textAlign = "left";
          baseCtx.fillText(String(tick / 4), x + 3, 18);
        }
      }

      arrangement.tracks.forEach((track, trackIndex) => {
        const trackTop = top + trackIndex * trackH;
        const laneH = trackH - 6;
        const isCc = track.events.length > 0 && track.events.every((e) => e.type === "cc");

        // Track separator line
        baseCtx.strokeStyle = "rgba(255,255,255,0.06)";
        baseCtx.lineWidth = 1;
        baseCtx.setLineDash([]);
        baseCtx.beginPath();
        baseCtx.moveTo(0, trackTop);
        baseCtx.lineTo(W, trackTop);
        baseCtx.stroke();

        // Track name
        baseCtx.font = 'bold 12px "Space Grotesk", sans-serif';
        baseCtx.fillStyle = "#edf2ff";
        baseCtx.textAlign = "left";
        baseCtx.fillText(track.name, 6, trackTop + 16);

        if (!isCc) {
          const noteZoneH = Math.floor(laneH * 0.76);
          const velZoneH = laneH - noteZoneH - 2;
          const velZoneY = trackTop + noteZoneH;

          const noteEvents = track.events.filter((e) => e.type !== "cc");
          const range = noteEvents.length ? pitchRange(noteEvents) : { min: 60, max: 68 };
          const pitchCount = range.max - range.min + 1;
          const rowH = noteZoneH / pitchCount;

          // Piano key rows
          for (let pitch = range.min; pitch <= range.max; pitch++) {
            const row = range.max - pitch;
            const y = trackTop + row * rowH;
            const isBlack = [1, 3, 6, 8, 10].includes(pitch % 12);
            if (isBlack) {
              baseCtx.fillStyle = "rgba(20,20,30,0.55)";
              baseCtx.fillRect(left, y, IW, rowH);
            }
            if (pitch % 12 === 0) {
              baseCtx.strokeStyle = "rgba(255,255,255,0.07)";
              baseCtx.lineWidth = 1;
              baseCtx.setLineDash([]);
              baseCtx.beginPath();
              baseCtx.moveTo(left, y);
              baseCtx.lineTo(W - right, y);
              baseCtx.stroke();
            }
          }

          // Pitch labels
          if (rowH >= 6) {
            baseCtx.textAlign = "right";
            baseCtx.font = '9px "IBM Plex Mono", monospace';
            baseCtx.fillStyle = "#3a4a6a";
            baseCtx.fillText(noteName(range.max), left - 4, trackTop + 10);
            baseCtx.fillText(noteName(range.min), left - 4, trackTop + noteZoneH - 2);
            baseCtx.textAlign = "left";
          }

          // Segment boundaries + labels
          track.segments.forEach((segment) => {
            const segX = left + (segment.start / totalLength) * IW;
            baseCtx.strokeStyle = "rgba(255,255,255,0.08)";
            baseCtx.lineWidth = 1;
            baseCtx.setLineDash([4, 4]);
            baseCtx.beginPath();
            baseCtx.moveTo(segX, trackTop);
            baseCtx.lineTo(segX, trackTop + laneH);
            baseCtx.stroke();
            baseCtx.setLineDash([]);
            if (trackH > 40 && segment.name) {
              baseCtx.font = '9px "IBM Plex Mono", monospace';
              baseCtx.fillStyle = "rgba(80,110,180,0.75)";
              baseCtx.fillText(segment.name, segX + 4, trackTop + 10);
            }
          });

          // Note rectangles
          noteEvents.forEach((ev) => {
            const x = left + (ev.start / totalLength) * IW;
            const w = Math.max(3, ev.duration / totalLength * IW - 1);
            const y = trackTop + (range.max - ev.pitch) * rowH + 1;
            const h = Math.max(3, rowH - 2);
            const fill = colorMap.get(ev.instrument) || "#7ae582";

            eventRects.set(ev.id, { x, y, w, h, fill });

            // Filled rect
            baseCtx.globalAlpha = 0.84;
            baseCtx.fillStyle = fill;
            baseCtx.beginPath();
            baseCtx.roundRect(x, y, w, h, 3);
            baseCtx.fill();

            // Stroke
            baseCtx.globalAlpha = 1;
            baseCtx.strokeStyle = "rgba(0,0,0,0.28)";
            baseCtx.lineWidth = 0.8;
            baseCtx.setLineDash([]);
            baseCtx.beginPath();
            baseCtx.roundRect(x, y, w, h, 3);
            baseCtx.stroke();

            // Label
            if (w > 22 && h > 9) {
              const label = ev.instrument === ev.label ? ev.label : ev.instrument + ": " + ev.label;
              baseCtx.font = '9px "IBM Plex Mono", monospace';
              baseCtx.fillStyle = "rgba(255,255,255,0.82)";
              baseCtx.textAlign = "left";
              baseCtx.fillText(label, x + 3, y + h * 0.72);
            }
          });

          // Velocity lane
          if (velZoneH > 5) {
            baseCtx.globalAlpha = 1;
            baseCtx.strokeStyle = "rgba(255,255,255,0.05)";
            baseCtx.lineWidth = 1;
            baseCtx.setLineDash([]);
            baseCtx.beginPath();
            baseCtx.moveTo(left, velZoneY);
            baseCtx.lineTo(W - right, velZoneY);
            baseCtx.stroke();

            noteEvents.forEach((ev) => {
              const x = left + (ev.start / totalLength) * IW;
              const velNorm = (ev.velocity || 100) / 127;
              const bH = Math.max(1, velNorm * velZoneH);
              baseCtx.fillStyle = colorMap.get(ev.instrument) || "#7ae582";
              baseCtx.globalAlpha = 0.55;
              baseCtx.fillRect(x, velZoneY + velZoneH - bH, 2, bH);
            });
            baseCtx.globalAlpha = 1;
          }

        } else {
          // CC track
          // Guide lines at 0%, 25%, 50%, 75%, 100%
          for (const pct of [0, 0.25, 0.5, 0.75, 1.0]) {
            const y = trackTop + laneH * (1 - pct);
            baseCtx.strokeStyle = "rgba(255,255,255,0.05)";
            baseCtx.lineWidth = 1;
            baseCtx.setLineDash([3, 4]);
            baseCtx.beginPath();
            baseCtx.moveTo(left, y);
            baseCtx.lineTo(W - right, y);
            baseCtx.stroke();
            baseCtx.setLineDash([]);
            if (trackH > 44) {
              baseCtx.font = '9px "IBM Plex Mono", monospace';
              baseCtx.fillStyle = "#3a4a6a";
              baseCtx.textAlign = "right";
              baseCtx.fillText(String(Math.round(pct * 127)), left - 4, y + 4);
              baseCtx.textAlign = "left";
            }
          }

          // Group events by ccn
          const ccGroups = new Map();
          track.events.forEach((ev) => {
            if (!ccGroups.has(ev.ccn)) ccGroups.set(ev.ccn, []);
            ccGroups.get(ev.ccn).push(ev);
          });

          const baseY = trackTop + laneH;

          ccGroups.forEach((events, ccn) => {
            const sorted = [...events].sort((a, b) => a.start - b.start);
            const fill = colorMap.get("cc" + ccn) || "#7c5cff";

            // Fill path (step function area)
            baseCtx.globalAlpha = 0.15;
            baseCtx.fillStyle = fill;
            baseCtx.beginPath();
            sorted.forEach((ev, i) => {
              const x1 = left + (ev.start / totalLength) * IW;
              const x2 = left + ((ev.start + ev.duration) / totalLength) * IW;
              const y = trackTop + laneH * (1 - ev.pitch / 127);
              if (i === 0) {
                baseCtx.moveTo(x1, baseY);
                baseCtx.lineTo(x1, y);
              } else {
                baseCtx.lineTo(x1, y);
              }
              baseCtx.lineTo(x2, y);
              if (i === sorted.length - 1) {
                baseCtx.lineTo(x2, baseY);
                baseCtx.closePath();
              }
            });
            baseCtx.fill();

            // Stroke path (step function line)
            baseCtx.globalAlpha = 1;
            baseCtx.strokeStyle = fill;
            baseCtx.lineWidth = 1.5;
            baseCtx.setLineDash([]);
            baseCtx.beginPath();
            sorted.forEach((ev, i) => {
              const x1 = left + (ev.start / totalLength) * IW;
              const x2 = left + ((ev.start + ev.duration) / totalLength) * IW;
              const y = trackTop + laneH * (1 - ev.pitch / 127);
              if (i === 0) {
                baseCtx.moveTo(x1, y);
              } else {
                baseCtx.lineTo(x1, y);
              }
              baseCtx.lineTo(x2, y);
            });
            baseCtx.stroke();

            // Store rects for highlighting
            sorted.forEach((ev) => {
              const x = left + (ev.start / totalLength) * IW;
              const w = Math.max(2, ev.duration / totalLength * IW - 1);
              const y = trackTop + laneH * (1 - ev.pitch / 127);
              const h = Math.max(4, baseY - y);
              eventRects.set(ev.id, { x, y, w, h, fill });
            });
          });
        }
      });

      // Reset context state
      baseCtx.globalAlpha = 1;
      baseCtx.setLineDash([]);

      // Legend
      legend.innerHTML = "";
      [...colorMap.entries()].forEach(([instrument, color]) => {
        const item = document.createElement("div");
        item.className = "legend-item";
        item.innerHTML = `<span class="legend-swatch" style="background:${color}"></span><span>${instrument}</span>`;
        legend.appendChild(item);
      });

      redrawHighlights();
    }

    function renderEmptyState(message) {
      clearActiveHighlights();
      zoomX = 1.0;
      eventRects.clear();
      const W = Math.max(200, rollFrame.clientWidth);
      const H = Math.max(200, rollFrame.clientHeight);
      baseCanvas.width = hlCanvas.width = W;
      baseCanvas.height = hlCanvas.height = H;
      baseCanvas.style.width = hlCanvas.style.width = W + "px";
      baseCanvas.style.height = hlCanvas.style.height = H + "px";
      baseCtx.fillStyle = "#0b0e15";
      baseCtx.fillRect(0, 0, W, H);
      baseCtx.textAlign = "center";
      baseCtx.font = '15px "IBM Plex Mono", monospace';
      baseCtx.fillStyle = "#2a3450";
      baseCtx.fillText("No notes to display", W / 2, H / 2 - 10);
      baseCtx.font = '11px "IBM Plex Mono", monospace';
      baseCtx.fillStyle = "#1a2440";
      baseCtx.fillText(message, W / 2, H / 2 + 14);
      baseCtx.textAlign = "left";
      legend.innerHTML = "";
    }

    function executePattern() {
      try {
        stopPlayback({ preserveStatus: true });
        const arrangement = assignEventIds(parseArrangement(input.value));
        const events = arrangement.tracks.flatMap((track) => track.events);
        if (!events.length) {
          throw new Error("No playable events were parsed. The pattern is empty or fully commented out.");
        }
        currentArrangement = arrangement;
        currentEvents = events;
        renderArrangement(arrangement);
        const instruments = [...new Set(events.map((event) => event.instrument))];
        const stepCount = arrangement.tracks.reduce((sum, track) => sum + track.segments.length, 0);
        status.textContent = `Rendered ${events.length} events across ${arrangement.tracks.length} track${arrangement.tracks.length === 1 ? "" : "s"}, ${stepCount} seq step${stepCount === 1 ? "" : "s"}, and ${instruments.length} instrument${instruments.length === 1 ? "" : "s"}.`;
      } catch (error) {
        currentArrangement = null;
        currentEvents = [];
        renderEmptyState("Pattern empty after parsing");
        status.textContent = error.message;
      }
    }

    function exportMidi() {
      if (!currentArrangement) {
        status.textContent = "No arrangement to export. Run pattern first.";
        return;
      }

      const PPQ = 480;
      const TICKS_PER_STEP = PPQ * 4; // 1 step = 4 beats = 1920 ticks
      const bpm = parseInt(bpmInput.value, 10) || 120;
      const microsecondsPerBeat = Math.round(60000000 / bpm);

      function vlq(value) {
        const bytes = [value & 0x7F];
        value >>= 7;
        while (value > 0) {
          bytes.unshift((value & 0x7F) | 0x80);
          value >>= 7;
        }
        return bytes;
      }

      function buildChunk(type, data) {
        const len = data.length;
        return [
          ...type.split('').map(c => c.charCodeAt(0)),
          (len >> 24) & 0xFF, (len >> 16) & 0xFF, (len >> 8) & 0xFF, len & 0xFF,
          ...data
        ];
      }

      const tracks = currentArrangement.tracks;
      const numTracks = tracks.length + 1; // +1 for tempo track

      const headerChunk = buildChunk('MThd', [
        0x00, 0x01,                           // format 1
        (numTracks >> 8) & 0xFF, numTracks & 0xFF,
        (PPQ >> 8) & 0xFF, PPQ & 0xFF
      ]);

      const tempoChunk = buildChunk('MTrk', [
        0x00, 0xFF, 0x51, 0x03,               // delta 0, tempo meta
        (microsecondsPerBeat >> 16) & 0xFF,
        (microsecondsPerBeat >> 8) & 0xFF,
        microsecondsPerBeat & 0xFF,
        0x00, 0xFF, 0x2F, 0x00                // end of track
      ]);

      const trackChunks = tracks.map(track => {
        const midiEvents = [];
        for (const event of track.events) {
          const startTick = Math.round(event.start * TICKS_PER_STEP);
          const ch = event.channel;
          if (event.type === 'note') {
            const endTick = Math.round((event.start + event.duration) * TICKS_PER_STEP);
            midiEvents.push({ tick: startTick, msg: [0x90 | ch, event.pitch, event.velocity] });
            midiEvents.push({ tick: endTick,   msg: [0x80 | ch, event.pitch, 0] });
          } else if (event.type === 'cc') {
            midiEvents.push({ tick: startTick, msg: [0xB0 | ch, event.ccn, event.pitch] });
          }
        }
        midiEvents.sort((a, b) => a.tick - b.tick || a.msg[0] - b.msg[0]);

        const trackData = [];
        let prevTick = 0;
        for (const ev of midiEvents) {
          const delta = ev.tick - prevTick;
          prevTick = ev.tick;
          trackData.push(...vlq(delta), ...ev.msg);
        }
        trackData.push(0x00, 0xFF, 0x2F, 0x00); // end of track

        return buildChunk('MTrk', trackData);
      });

      const allBytes = new Uint8Array([...headerChunk, ...tempoChunk, ...trackChunks.flat()]);
      const blob = new Blob([allBytes], { type: 'audio/midi' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'arrangement.mid';
      a.click();
      URL.revokeObjectURL(url);
      status.textContent = `Exported ${tracks.length} track(s) as arrangement.mid`;
    }

    rollFrame.addEventListener("wheel", (e) => {
      if (!currentArrangement) return;
      e.preventDefault();
      const rect = rollFrame.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const oldZoom = zoomX;
      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      zoomX = Math.max(1, Math.min(16, zoomX * factor));
      if (zoomX === oldZoom) return;
      const contentX = rollFrame.scrollLeft + mouseX;
      const scaleFactor = zoomX / oldZoom;
      renderArrangement(currentArrangement);
      rollFrame.scrollLeft = contentX * scaleFactor - mouseX;
    }, { passive: false });

    runButton.addEventListener("click", executePattern);
    playButton.addEventListener("click", startPlayback);
    stopButton.addEventListener("click", () => stopPlayback());
    exportMidiButton.addEventListener("click", exportMidi);
    drawerHandle.addEventListener("click", toggleDrawer);
    midiRefreshButton.addEventListener("click", async () => {
      try {
        await refreshMidiOutputs();
        status.textContent = `MIDI outputs refreshed.${getSelectedMidiOutput() ? ` Selected: ${getSelectedMidiOutput().name || getSelectedMidiOutput().id}.` : ""}`;
      } catch (error) {
        status.textContent = `Unable to access Web MIDI: ${error.message}`;
      }
    });
    input.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        executePattern();
      }
    });
    document.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "b") {
        event.preventDefault();
        toggleDrawer();
      }
    });

    setDrawerOpen(true);
    refreshMidiOutputs().catch(() => {});
    executePattern();
  </script>
</body>
</html>
